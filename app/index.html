<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=description content="Mission Control: a zero-framework console for make.fun. Live bounty board, bounty pages, leaderboards and profiles.">
<title>Mission Control · make.fun</title>
<style>
:root{--bg:#090c0f;--p:#10151a;--l:#222b34;--t:#dbe2e9;--d:#8a98a6;--g:#4ade80;--a:#fbbf24;--c:#6dd3ff;--r:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
a{color:var(--c);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--a);outline-offset:1px}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;background:var(--p);border-bottom:1px solid var(--l)}
.brand{color:var(--g);font-weight:700;letter-spacing:.1em;white-space:nowrap}
nav{display:flex}
nav a{padding:9px 7px;color:var(--d)}
nav a[aria-current]{color:var(--t);box-shadow:inset 0 -2px var(--g)}
.tel{margin-left:auto;color:var(--d);font-size:11px;white-space:nowrap}
.tel::before{content:'● ';color:var(--g)}
main{max-width:1180px;margin:auto;padding:10px 12px 24px}
h1{margin:0 0 2px;font-size:19px;line-height:1.25}
h1 small{font-size:12px;font-weight:400}
h2{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--d)}
h3{margin:14px 0 4px;font-size:13px;color:var(--a)}
p{margin:0 0 8px}
small,.dim{color:var(--d)}
.pot{color:var(--g)}
.time{color:var(--a)}
.over{color:var(--r)}
.crumb{margin:0 0 2px;font-size:11px;color:var(--d)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;padding:0 6px;border:1px solid;border-radius:3px;font-size:11px;vertical-align:2px}
.panel{margin:0 0 10px;padding:9px 10px;background:var(--p);border:1px solid var(--l);border-radius:4px;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
input,button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--l);border-radius:3px;padding:4px 8px}
input{flex:1;min-width:150px}
button{cursor:pointer;color:var(--d)}
button[aria-pressed=true]{color:var(--bg);background:var(--g);border-color:var(--g)}
.row,.lrow{display:grid;gap:0 12px;align-items:center;height:30px;padding:0 8px;color:var(--t);border-bottom:1px solid var(--l);white-space:nowrap}
.row{grid-template-columns:minmax(0,1fr) 86px 56px 92px 66px}
.lrow{grid-template-columns:30px minmax(0,2fr) minmax(0,3fr) 116px;gap:0 8px}
.row>*,.lrow>*{overflow:hidden;text-overflow:ellipsis}
a.row:hover,a.lrow:hover,.lrow[aria-current]{background:#17202a;text-decoration:none}
.hd{height:24px;font-size:11px;letter-spacing:.1em;color:var(--d)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.row .pot{font-size:15px;font-weight:700}
.late{opacity:.55}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 10px}
.kpi{padding:6px 10px;background:var(--p);border:1px solid var(--l);border-radius:4px;min-width:0}
.kpi b{display:block;font-size:20px;line-height:1.25;white-space:nowrap}
.kpi small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:10px;align-items:start}
.split aside{position:sticky;top:48px;max-height:calc(100vh - 58px);overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td+td{text-align:right;padding-left:8px}
td:last-child:not(:first-child){width:74px}
td:last-child.wide{width:150px}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;margin:0}
dt{color:var(--d)}
dd{margin:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{position:relative;overflow-y:auto;height:calc(100vh - 172px);min-height:150px}
@media(max-width:899px){.x{display:none}}
#win{position:absolute;left:0;right:0;top:0}
.score{background:linear-gradient(90deg,#16402a var(--w,0%),transparent 0)}
.who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.who img{width:48px;height:48px;border-radius:50%;background:var(--l)}
.md{overflow-wrap:anywhere}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}
code,pre{color:var(--a)}
pre{overflow:auto}
summary{cursor:pointer;color:var(--c)}
@media(max-width:599px){
header{gap:6px;padding:0 8px}
.tel,.brand span{display:none}
h1 small{display:block}
.row{grid-template-columns:repeat(4,1fr);height:auto;padding:7px 8px}
.row>:first-child{grid-column:1/-1;white-space:normal}
.row.hd>:first-child{display:none}
.lrow{grid-template-columns:36px 96px minmax(0,1fr) 70px}
.kpis{grid-template-columns:1fr 1fr}
.cols,.split{grid-template-columns:minmax(0,1fr)}
.split aside{order:-1;position:static;max-height:none}
}
</style>
<header>
<a class=brand href=#/ aria-label="Mission Control, the bounty board">▚<span> MISSION CONTROL</span></a>
<nav id=nav><a href=#/>Board</a><a id=nb>Bounty</a><a id=nl>Leaderboard</a><a id=nu>Profile</a></nav><script type=module>import('./app.js')</script><span class=tel title="requests sent · answered unchanged by ETag · views painted from memory">acquiring signal</span>
</header>
<main tabindex=-1></main>
